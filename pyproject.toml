[project]
name = "marketkit-cli"
version = "0.1.0"
description = "Structured market research for AI coding agents. Phased commands for ICP definition, query planning, parallel data collection, and synthesis."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "click>=8.1",
    "rich",
    "httpx",
    "truststore>=0.10.4",
    "platformdirs",
    "readchar",
]

[project.scripts]
marketkit = "marketkit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketkit"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "marketkit/templates"

[tool.hatch.build.targets.sdist]
include = ["src/marketkit", "templates"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
